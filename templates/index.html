<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel SQL生成工具</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.88em%22 font-size=%2282%22>🍄</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='codemirror.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='monokai.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="btn btn-header layout-toggle" id="layoutToggleBtn" onclick="toggleLayout()" aria-pressed="false">双列布局</button>
            <h1>Excel SQL生成工具🚀</h1>
            <p>上传Excel文件，输入SQL模板，自动生成批量SQL语句</p>
            <p>XWR制作</p>
        </div>
        <div class="content">
            <div id="alertArea"></div>

            <div class="layout-columns" id="layoutColumns">
                <div class="layout-left">
                    <div class="section" id="uploadSection">
                        <div class="section-title">步骤1：上传Excel文件</div>
                        <div class="upload-area" id="uploadArea">
                            <div class="upload-icon">📁</div>
                            <div class="upload-text">点击或拖拽Excel文件到此处上传</div>
                            <p style="font-size: 12px; color: #999; margin-top: 10px;">支持 .xlsx 和 .xls 格式</p>
                        </div>
                        <input type="file" id="fileInput" accept=".xlsx,.xls">
                    </div>
                    
                    <div class="section" id="columnsSection" style="display: none;">
                        <div class="columns-sticky-header">
                            <div class="section-title">可用列信息</div>
                            <button class="btn btn-ghost reupload-btn" onclick="reuploadExcel()">重新上传</button>
                            <input type="text" id="columnSearch" class="column-search" placeholder="搜索列名或占位符，例如：姓名 / column1 / $column1$">
                        </div>
                        <div class="columns-info" id="columnsInfo"></div>
                        <div class="column-search-empty" id="columnSearchEmpty">没有匹配的占位符</div>
                        <div class="data-preview" id="dataPreview"></div>
                    </div>
                </div>

                <div class="layout-right">
                    <div class="section" id="templateSection" style="display: none;">
                        <div class="section-title">步骤2：输入SQL模板</div>
                        <p style="margin-bottom: 10px; color: #666; font-size: 14px;">
                            使用 $column1$, $column2$ 代表Excel列，点击占位符复制带单引号的版本，不需要引号时手动去掉即可
                        </p>
                        <textarea id="sqlTemplate" placeholder="例如: update table1 set age = $column2$ where name = '$column1$'"></textarea>
                        <div class="button-group">
                            <button class="btn btn-primary" id="generateBtn" onclick="generateSQL()">生成SQL</button>
                        </div>
                    </div>
                    
                    <div class="section" id="resultSection" style="display: none;">
                        <div class="section-title">步骤3：预览与下载</div>
                        <p style="margin-bottom: 10px; color: #666; font-size: 14px;" id="resultCount"></p>
                        <div class="preview-box">
                            <pre id="sqlResult" class="cm-s-default"></pre>
                        </div>
                        <div class="button-group">
                            <button class="btn btn-success" onclick="downloadSQL()">下载TXT文件</button>
                            <button class="btn btn-success" onclick="copySQLToClipboard()" id="copyBtn">复制文本</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='codemirror.min.js') }}"></script>
    <script src="{{ url_for('static', filename='addon/runmode/runmode.min.js') }}"></script>
    <script src="{{ url_for('static', filename='mode/sql/sql.min.js') }}"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
